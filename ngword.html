<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>NGワードゲーム</title>
    <style>
        .selected {
            background: #8cf;
        }

        button {
            margin: 4px;
            padding: 8px 12px;
        }
    </style>
</head>

<body>
    <h1>NGワードゲーム</h1>

    <div id="number-select">
        <p>自分の番号を選んでください：</p>
        <div id="numbers"></div>
    </div>

    <div id="instruction" style="margin-top:12px;">番号を選んでからスタートを押してください。</div>

    <div id="start" style="margin-top:12px;">
        <button id="startBtn" onclick="startCountdown()">スタート</button>
    </div>

    <div id="countdown" style="display:none; font-size:48px; margin-top:12px;"></div>
    <div id="ngword" style="display:none; font-size:32px; margin-top:12px;"></div>

    <div id="options" style="display:none; margin-top:12px;">
        <button id="nextBtn" onclick="onNext()">次に進む</button>
        <button onclick="goHome()">ホームに戻る</button>
    </div>

    <script src="ngword.js"></script>
</body>

</html>
